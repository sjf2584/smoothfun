<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>마인드 플립 : 뒤집히는 규칙 인지 유연성 테스트 | 스무스펀</title>
  <meta name="description" content="매 턴마다 뒤집히는 규칙에 맞춰 정확하게 판단하세요. 뇌정지가 오는 상황에서 얼마나 빠르게 적응하는지 인지 유연성을 테스트합니다.">
  <meta name="keywords" content="인지 유연성, 뇌정지 게임, 두뇌 퍼즐, 마인드 플립, 판단력 테스트">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080816; --surface:#0f0f28; --surface2:#181840;
      --accent:#6c3aff; --cyan:#00d4ff; --pink:#ff3aac;
      --gold:#ffd700; --text:#e8e8ff; --dim:#6060a0;
      --green:#00ff88; --red:#ff4444; --blue:#0088ff;
    }
    :root[data-theme="light"] {
      --bg:#f0f2ff; --surface:#ffffff; --surface2:#e8eaff;
      --accent:#5b2de0; --cyan:#0099cc; --pink:#cc2299;
      --gold:#b8860b; --text:#1a1a3a; --dim:#8080b0;
      --green:#00aa55; --red:#cc2222; --blue:#0055ff;
    }
    :root[data-theme="light"] .lb-warning { color:#cc2222; background:rgba(204,34,34,.1); border-color:rgba(204,34,34,.3); }

    * { box-sizing:border-box; margin:0; padding:0; user-select:none; }
    body {
      font-family:'Outfit','Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--text); transition:background .3s, color .3s;
      overflow-x:hidden;
    }

    @media(min-width:1100px) {  }

    header { text-align:center; padding:2rem 1rem 1rem; position:relative; z-index:2; }
    .btn-home {
      position:absolute; top:1.5rem; left:50%; transform:translateX(-380px);
      background:var(--surface); color:var(--cyan); border:1px solid rgba(0,212,255,.3);
      padding:.4rem 1rem; border-radius:20px; text-decoration:none; font-weight:700; transition:all .2s;
    }
    @media(max-width:800px) {
      .btn-home { position:static; display:inline-block; transform:none; margin-bottom:1rem; }
    }
    .btn-home:hover { background:var(--cyan); color:#000; box-shadow:0 0 15px rgba(0,212,255,.4); }
    
    h1 {
      font-size:clamp(2.5rem, 6vw, 4rem); font-weight:900; letter-spacing:-1px; line-height:1.1;
      background:linear-gradient(to right, var(--cyan), var(--accent));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      text-transform:uppercase;
    }
    header p { color:var(--dim); font-weight:700; margin-top:.5rem; }

    /* Controls */
    .controls { display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin:1rem; z-index:2; position:relative; }
    .ctrl-row { display:flex; background:var(--surface2); padding:4px; border-radius:24px; box-shadow:inset 0 2px 4px rgba(0,0,0,.2); }
    
    .tog-btn {
      padding:.6rem 1.2rem; border:none; background:transparent; color:var(--dim);
      font-weight:800; font-family:inherit; font-size:.9rem; cursor:pointer; border-radius:20px; transition:all .2s;
    }
    .tog-btn.active { background:linear-gradient(135deg,var(--accent),var(--cyan)); color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.3); }

    /* Light Theme controls */
    :root[data-theme="light"] .tog-btn { color:#6060a0; }
    :root[data-theme="light"] .tog-btn.active {
      background:var(--surface); border:2.5px solid var(--accent); color:var(--accent);
      box-shadow:0 0 0 3px rgba(91,45,224,.12);
    }
    :root[data-theme="light"] .tog-btn.active::before { content:'● '; font-size:.6rem; }

    /* Game Zone */
    .game-zone {
      margin: 1rem auto; display:flex; flex-direction:column; align-items:center;
      width:min(90vw, 500px); position:relative; z-index:1;
    }
    
    .score-disp { font-size:2rem; font-weight:900; color:var(--cyan); margin-bottom:.2rem; font-variant-numeric: tabular-nums; }
    .best-disp { font-size:.8rem; color:var(--dim); margin-bottom:1rem; }

    /* Rule Banner */
    .rule-banner {
      width: 100%; border-radius:16px; padding:1.5rem 1rem; text-align:center;
      background: var(--surface); border: 2px solid var(--surface2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 2rem;
      min-height: 100px; display:flex; align-items:center; justify-content:center;
      flex-direction: column; transition: all 0.2s; position:relative;
    }
    .rule-text {
      font-size: 1.5rem; font-weight: 800; line-height: 1.3;
      word-break: keep-all; transition: color 0.2s;
    }
    .rule-banner.inverted {
      background: #ffdb58; border-color: var(--red); color: #000;
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.4);
    }
    .rule-banner.inverted .rule-text { color: #d00000; }

    /* Timing Bar */
    .time-bar-wrap {
      width: 100%; height: 8px; background: rgba(0,0,0,0.3);
      position: absolute; bottom: 0; left: 0; border-radius: 0 0 16px 16px; overflow: hidden;
    }
    .time-bar {
      height: 100%; background: var(--cyan); width: 100%;
      transition: width 0.05s linear, background 0.3s;
    }

    /* Target Area */
    .target-area {
      position: relative; width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
    }
    .target-bg {
      position: absolute; inset: 0; border-radius: 24px;
      background: var(--surface); border: 2px dashed rgba(108,58,255,0.3);
      z-index: 0;
    }
    
    /* Target Shape */
    .shape {
      width: 140px; height: 140px; position: relative; z-index: 2;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, box-shadow 0.1s; display:none;
    }
    .shape:active { transform: scale(0.9); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
    
    /* Shapes */
    .shape.square { border-radius: 24px; }
    .shape.circle { border-radius: 50%; }
    .shape.triangle {
      width: 0; height: 0; background: transparent !important; box-shadow: none !important;
      border-left: 70px solid transparent; border-right: 70px solid transparent;
      border-bottom: 140px solid currentColor;
    }
    .shape.triangle::after {
      content:''; position:absolute; left:-70px; top:0; width:140px; height:140px;
      cursor:pointer; /* hitbox */
    }

    /* Colors */
    .color-red { background: var(--red); color: var(--red); }
    .color-blue { background: var(--blue); color: var(--blue); }
    .color-green { background: var(--green); color: var(--green); }

    /* Overlay / State */
    .pad-overlay {
      position: absolute; inset: -10px; z-index: 10;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border-radius: 30px;
      display: flex; flex-direction:column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .pad-overlay.active { opacity: 1; pointer-events: auto; }
    
    .state-msg { font-size:1.5rem; font-weight:900; margin-bottom:1rem; text-shadow:0 2px 10px rgba(0,0,0,0.5); }
    .state-msg.fail { color:var(--red); }

    .start-btn {
      padding: .8rem 2rem; border: none; border-radius: 14px;
      font-family: inherit; font-size: 1.2rem; font-weight: 800; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff;
      box-shadow: 0 4px 16px rgba(108,58,255,0.4); transition: transform 0.2s;
    }
    .start-btn:hover { transform: translateY(-2px); }

    .key-guide {
      text-align: center; color: var(--dim); font-size: 0.9rem; margin-top: 1rem;
      font-weight: 700;
    }
    .key-guide kbd {
      background: var(--surface2); padding: 4px 10px; border-radius: 6px;
      border-bottom: 2px solid rgba(0,0,0,0.3); font-family: inherit; font-size: 0.85rem;
      color: var(--text);
    }
    
    /* Leaderboard */
    .lb-section { width:min(90vw, 500px); margin:2rem auto 4rem; position:relative; z-index:1; }
    .lb-header { text-align:center; margin-bottom:1rem; }
    .lb-header h2 { font-size:1.4rem; font-weight:800; color:var(--dim); }
    .lb-tabs { display:flex; justify-content:center; gap:.5rem; margin-bottom:1rem; }
    .lb-tab {
      background:var(--surface); border:1px solid rgba(255,255,255,.1); color:var(--dim);
      padding:.4rem 1rem; border-radius:20px; cursor:pointer; font-weight:700; font-family:inherit;transition:all .2s;
    }
    .lb-tab.active { background:var(--gold); color:#000; border-color:var(--gold); font-weight:800; }
    
    .lb-list { background:var(--surface); border-radius:16px; padding:1rem; box-shadow:0 10px 30px rgba(0,0,0,.2); }
    .lb-item {
      display:flex; justify-content:space-between; padding:.8rem 1rem;
      border-bottom:1px solid rgba(255,255,255,.05); font-weight:700;
    }
    .lb-item:last-child { border-bottom:none; }
    .lb-item.empty { justify-content:center; color:var(--dim); font-weight:400; }
    
    .rank-1 { color:var(--gold); font-size:1.1rem; }
    .rank-2 { color:#C0C0C0; font-size:1.05rem; }
    .rank-3 { color:#CD7F32; }

    :root[data-theme="light"] .lb-tab { background:#fff; border-color:#e0e0e0; }
    :root[data-theme="light"] .lb-tab.active { background:var(--gold); color:#000; border-color:var(--gold); }
    :root[data-theme="light"] .lb-list { background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.05); }
    :root[data-theme="light"] .lb-item { border-bottom:1px solid #f0f0f0; color:#444; }
  
     }
  
    .lb-warning {
      background:rgba(255,68,68,.1); border:1px solid rgba(255,68,68,.3);
      color:#ffaaaa; font-size:.75rem; padding:.8rem; border-radius:8px;
      margin-bottom:1.5rem; line-height:1.4; text-align:center; word-break:keep-all;
    }

</style>

<body>

<header>
  <a href="index.html" class="btn-home">← 홈으로</a>
  <h1>MIND FLIP</h1>
  <p>매 턴마다 뒤집히는 규칙! 뇌정지 한계 테스트</p>
</header>

<div class="controls">
  <div class="ctrl-row" id="modeRow">
    <button class="tog-btn active" data-mode="normal">🟢 단일 규칙 (Normal)</button>
    <button class="tog-btn" data-mode="hard">🔄 반전 + 조합 (Hard)</button>
  </div>
</div>

<div class="game-zone">
  <div class="score-disp" id="scoreDisp">0</div>
  <div class="best-disp" id="bestDisp">최고 기록: -</div>

  <div class="rule-banner" id="ruleBanner">
    <div class="rule-text" id="ruleText">스페이스바나 타겟을 눌러 준비!</div>
    <div class="time-bar-wrap"><div class="time-bar" id="timeBar"></div></div>
  </div>

  <div class="target-area">
    <div class="target-bg"></div>
    <div class="shape" id="targetObj"></div>
    
    <div class="pad-overlay active" id="padOverlay">
      <div class="state-msg" id="stateMsg">준비 됨!</div>
      <button class="start-btn" id="startBtn" onclick="startGame()">START</button>
    </div>
  </div>

  <div class="key-guide">타겟을 터치하거나 <kbd>Space</kbd> 키를 누르세요</div>
</div>

<div class="lb-section">
  <div class="lb-warning">⚠️ <b>정정당당한 승부!</b><br>클라이언트 변조를 통한 비정상적인 스코어 조작은 모든 참여자의 재미를 반감시킵니다. 양심적인 플레이를 부탁드립니다.</div>
  <div class="lb-header"><h2>🏆 명예의 전당</h2></div>
  <div class="lb-tabs" id="lbTabs">
    <button class="lb-tab active" data-cat="mindflip_normal">Normal 모드</button>
    <button class="lb-tab" data-cat="mindflip_hard">Hard 모드</button>
  </div>
  <div class="lb-list" id="lbList"><div class="lb-item empty">랭킹 불러오는 중...</div></div>
</div>

<script>
// ── Core Game State ──
let mode = 'normal';
let score = 0;
let sessionBest = 0;
let gameState = 'idle'; // idle, playing, over
let allowInput = false;

// Time scaling
let baseTime = 1800; // ms per turn
const minTime = 600;

// Element Refs
const scoreDisp = document.getElementById('scoreDisp');
const bestDisp = document.getElementById('bestDisp');
const ruleBanner = document.getElementById('ruleBanner');
const ruleText = document.getElementById('ruleText');
const timeBar = document.getElementById('timeBar');
const targetObj = document.getElementById('targetObj');
const padOverlay = document.getElementById('padOverlay');
const stateMsg = document.getElementById('stateMsg');
const startBtn = document.getElementById('startBtn');

// Rule & Target Definition
const colors = ['red', 'blue', 'green'];
const shapes = ['square', 'circle', 'triangle'];
const colorNames_ko = { red: '빨강색', blue: '파란색', green: '초록색' };
const shapeNames_ko = { square: '사각형', circle: '원형', triangle: '삼각형' };

let currentRule = null;
let currentTarget = null;
let turnTimer = null;
let barInterval = null;
let turnStartTime = 0;
let currentTurnDuration = 0;

// Synth Setup (reused from pitch/echo concepts but simple ping)
const synth = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  playPing(type) {
    if(!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    const t = this.ctx.currentTime;
    if (type === 'good') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
      gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'bad') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
      gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.start(t); osc.stop(t + 0.2);
    } else if (type === 'flip') {
      osc.type = 'square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t + 0.1);
      gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.start(t); osc.stop(t + 0.1);
    }
  }
};
document.addEventListener('pointerdown', () => synth.init(), {once:true});
document.addEventListener('keydown', () => synth.init(), {once:true});

// ── Mode Switch ──
document.getElementById('modeRow').addEventListener('click', e => {
  if (gameState !== 'idle' && gameState !== 'over') return;
  const btn = e.target.closest('.tog-btn');
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#modeRow .tog-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadLeaderboard(`mindflip_${mode}`);
  sessionBest = 0;
  bestDisp.textContent = '최고 기록: -';
});

// ── Rules Engine ──
function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateTurn() {
  // Clear prev visual
  targetObj.style.display = 'none';
  targetObj.className = 'shape'; // reset classes
  ruleBanner.className = 'rule-banner'; // reset classes

  // 1. Generate Target
  currentTarget = {
    color: getRandomItem(colors),
    shape: getRandomItem(shapes)
  };

  // 2. Generate Rule
  // Normal mode: condition based on color OR shape. Positive or Negative.
  // Hard mode: inverted logic (background turns yellow), combinatorial ("red square").
  const isHard = (mode === 'hard');
  
  let conditionType = Math.random() < 0.5 ? 'color' : 'shape';
  let targetVal = conditionType === 'color' ? getRandomItem(colors) : getRandomItem(shapes);
  let isPositive = Math.random() < 0.5; // true = click if match, false = click if NO match
  
  let inverted = false;
  if (isHard && Math.random() < 0.3) {
    inverted = true; // Flips the whole evaluation meaning
  }

  // Combinatorial rule tracking (only for text generation here, simplifed actual logic)
  let ruleDesc = '';
  if (isHard && Math.random() < 0.3) {
    // Combination rule
    let ruleCol = getRandomItem(colors);
    let ruleShp = getRandomItem(shapes);
    conditionType = 'combo';
    targetVal = { color: ruleCol, shape: ruleShp };
    ruleDesc = `${colorNames_ko[ruleCol]} ${shapeNames_ko[ruleShp]}`;
  } else {
    // Single condition rule
    ruleDesc = conditionType === 'color' ? colorNames_ko[targetVal] : shapeNames_ko[targetVal];
  }

  if (isPositive) {
    ruleText.textContent = `${ruleDesc}이면 클릭하세요`;
  } else {
    ruleText.textContent = `${ruleDesc}이면 클릭하지 마세요`;
  }

  if (inverted) {
    ruleBanner.classList.add('inverted');
    // Prepend reverse warning
    ruleText.textContent = `⚠️반대⚠️ ${ruleText.textContent}`;
  }

  currentRule = { type: conditionType, val: targetVal, positive: isPositive, inverted: inverted };

  // Calculate strict correct action: required to click?
  let match = false;
  if (currentRule.type === 'color') match = (currentTarget.color === currentRule.val);
  else if (currentRule.type === 'shape') match = (currentTarget.shape === currentRule.val);
  else if (currentRule.type === 'combo') match = (currentTarget.color === currentRule.val.color && currentTarget.shape === currentRule.val.shape);
  
  // if Positive rule: Should click if match is true.
  // if Negative rule: Should click if match is false.
  let shouldClick = currentRule.positive ? match : !match;
  
  // if Inverted global modifier is on, flip the final required action
  if (currentRule.inverted) {
    shouldClick = !shouldClick;
    synth.playPing('flip'); // auditory cue that mind must flip
  }

  currentRule.requiresAction = shouldClick;

  // 3. Render Target Object
  targetObj.classList.add(currentTarget.shape);
  targetObj.classList.add(`color-${currentTarget.color}`);
  targetObj.style.display = 'block';

  // 4. Setup Timing
  // Decrease time linearly but cap at minTime
  currentTurnDuration = Math.max(minTime, baseTime - (score * 40));
  
  turnStartTime = performance.now();
  timeBar.style.transition = 'none';
  timeBar.style.width = '100%';
  // Force reflow
  void timeBar.offsetWidth;
  timeBar.style.transition = `width ${currentTurnDuration/1000}s linear`;
  timeBar.style.width = '0%';
  
  allowInput = true;
  
  turnTimer = setTimeout(() => {
    handleTimeOut();
  }, currentTurnDuration);
}

// ── Interaction Logic ──
function triggerAction(actionName) {
  if (gameState !== 'playing' || !allowInput) return;
  allowInput = false;
  clearTimeout(turnTimer);
  
  // We clicked (or tapped/spaced). Was it required?
  if (currentRule.requiresAction) {
    // Correct!
    winTurn();
  } else {
    // Incorrect! We clicked when we shouldn't have.
    gameOver("클릭하면 안 되는 조건이었습니다!");
  }
}

function handleTimeOut() {
  if (gameState !== 'playing' || !allowInput) return;
  allowInput = false;
  
  // Waited till end. Was interaction required?
  if (currentRule.requiresAction) {
    // Incorrect! We didn't click when we were supposed to.
    gameOver("클릭해야 하는 조건이었습니다!");
  } else {
    // Correct! We successfully ignored.
    winTurn();
  }
}

function winTurn() {
  synth.playPing('good');
  score++;
  scoreDisp.textContent = score;
  
  targetObj.style.display = 'none';
  timeBar.style.width = '0%';
  
  // Brief pause before next turn
  setTimeout(() => {
    if (gameState === 'playing') generateTurn();
  }, 200);
}

function gameOver(reason) {
  gameState = 'over';
  synth.playPing('bad');
  
  if (score > sessionBest) {
    sessionBest = score;
    bestDisp.textContent = `최고 기록: ${sessionBest}`;
  }

  timeBar.style.transition = 'none';
  timeBar.style.width = '0%';
  
  stateMsg.textContent = "💀 실패!";
  stateMsg.className = "state-msg fail";
  padOverlay.classList.add('active');
  startBtn.textContent = "다시 도전 🔄";
  
  // small feedback text below rule banner
  ruleText.textContent = reason;
  targetObj.style.display = 'none';
  ruleBanner.className = 'rule-banner'; // strip invert colors

  saveScore(score);
}

// ── Game Flow ──
function startGame() {
  gameState = 'playing';
  score = 0;
  scoreDisp.textContent = score;
  padOverlay.classList.remove('active');
  ruleText.textContent = "준비...";
  targetObj.style.display = 'none';
  
  setTimeout(() => {
    generateTurn();
  }, 500);
}

// Global Inputs: Space or Clicking the target area 
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameState === 'playing') {
      triggerAction('click');
    } else if (gameState === 'idle' || gameState === 'over') {
      startGame();
    }
  }
});
targetObj.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  triggerAction('click');
});

// ── Leaderboard / DB ──
async function saveScore(reached) {
  if (reached < 1) return;
  const cat = `mindflip_${mode}`;
  if (!window.dbAPI) return;
  try {
    const isTop = await window.dbAPI.isTop10('mindflip', cat, reached, 'desc');
    if (isTop) {
      const name = window.dbAPI.getGuestId();
      await window.dbAPI.saveScore('mindflip', cat, name, reached, `${reached}점`);
      if (currentLbCat === cat) loadLeaderboard(cat);
    }
  } catch(e) { }
}

let currentLbCat = 'mindflip_normal';
function loadLeaderboard(cat = currentLbCat) {
  currentLbCat = cat;
  document.querySelectorAll('.lb-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  const list = document.getElementById('lbList');
  list.innerHTML = '<div class="lb-item empty">데이터를 불러오는 중...</div>';
  if (!window.dbAPI) { setTimeout(() => loadLeaderboard(cat), 150); return; }
  window.dbAPI.getTop10('mindflip', cat, 'desc').then(data => {
    if (!data || !data.length) {
      list.innerHTML = '<div class="lb-item empty">아직 기록이 없습니다. 첫 도전자가 되세요!</div>';
      return;
    }
    list.innerHTML = data.map((d, i) => `
      <div class="lb-item">
        <span class="${i<3?'rank-'+(i+1):''}">${i+1}. ${d.name}</span>
        <span style="color:var(--cyan)">${d.extraText}</span>
      </div>
    `).join('');
  }).catch(() => {
    list.innerHTML = '<div class="lb-item empty">랭킹을 불러올 수 없습니다.</div>';
  });
}

document.getElementById('lbTabs').addEventListener('click', e => {
  if (e.target.classList.contains('lb-tab')) loadLeaderboard(e.target.dataset.cat);
});
window.addEventListener('DOMContentLoaded', () => loadLeaderboard(`mindflip_${mode}`));

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>눈 감고 초 맞추기 : 완벽한 시간 감각 테스트 | 스무스펀</title>
  <meta name="description" content="타이머가 사라진 후 10초, 30초 등 정확한 시간에 버튼을 멈추세요! 0.001초 승부를 가리는 완벽한 시계 감각 테스트입니다.">
  <meta name="keywords" content="스톱워치 초 맞추기, 시간 감각, 10초 맞추기, 타이머 멈추기, 인체시계">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080816; --surface:#0f0f28; --surface2:#181840;
      --accent:#6c3aff; --cyan:#00d4ff; --pink:#ff3aac;
      --gold:#ffd700; --text:#e8e8ff; --dim:#6060a0;
      --green:#00ff88; --red:#ff4444;
    }
    :root[data-theme="light"] {
      --bg:#f0f2ff; --surface:#ffffff; --surface2:#e8eaff;
      --accent:#5b2de0; --cyan:#0099cc; --pink:#cc2299;
      --gold:#b8860b; --text:#1a1a3a; --dim:#8080b0;
      --green:#00aa55; --red:#cc2222;
    }
    :root[data-theme="light"] body::before { background:none; }
    :root[data-theme="light"] .timer-wrap {
      background:#fff; border-color:rgba(91,45,224,.4);
      box-shadow:0 0 30px rgba(91,45,224,.1);
    }
    :root[data-theme="light"] .opt-btn { background:#f0f2ff; border-color:rgba(0,0,0,.15); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Outfit','Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; overflow-x:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(108,58,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 90%, rgba(0,212,255,.08) 0%, transparent 60%);
      z-index: 0;
    }

    header { text-align:center; padding:4.5rem 1rem .5rem; z-index:1; position:relative; }
    header h1 {
      font-size:clamp(1.8rem,5vw,3rem); font-weight:900;
      background:linear-gradient(135deg,var(--cyan),var(--accent),var(--pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    header p { color:var(--dim); font-size:.9rem; margin-top:.4rem; }

    .btn-home {
      display: inline-block; position: absolute; left: 1rem; top: 1rem;
      padding: .4rem .8rem; border-radius: 8px; font-size: .8rem; font-weight: 700;
      color: var(--cyan); text-decoration: none; border: 1px solid rgba(0,212,255,.3);
      transition: all .2s;
    }
    .btn-home:hover { background: rgba(0,212,255,.1); }

    /* ── Controls ── */
    .controls {
      display:flex; flex-direction:column; align-items:center; gap:.8rem;
      margin:1rem 0; z-index:1; position:relative;
      width:min(500px, 100% - 2rem);
    }
    .ctrl-label {
      font-size:.75rem; color:var(--dim); font-weight:800; letter-spacing:.08em;
      text-transform:uppercase; margin-bottom:.2rem;
    }
    .btn-row {
      display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; width:100%;
    }
    
    .opt-btn {
      flex: 1 1 auto;
      min-width: 60px; padding:.6rem .8rem; border:1.5px solid rgba(0,212,255,.3);
      background:var(--surface); border-radius:10px; cursor:pointer;
      font-family:inherit; font-size:1rem; font-weight:700; color:var(--cyan);
      transition:all .2s;
    }
    .opt-btn:hover { background:rgba(0,212,255,.1); }
    .opt-btn.active {
      background:var(--cyan); color:#000; border-color:var(--cyan);
      box-shadow:0 0 15px rgba(0,212,255,.4);
    }

    /* ── Timer Display ── */
    .timer-wrap {
      margin: 1.5rem 0; position:relative; z-index:1;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:min(400px, 100% - 2rem); aspect-ratio:1/1;
      background:var(--surface); border-radius:50%;
      border:4px solid rgba(108,58,255,.4);
      box-shadow: 0 0 40px rgba(108,58,255,.2), inset 0 0 40px rgba(0,0,0,.5);
      transition: all .3s ease;
    }
    .timer-wrap.running { border-color:var(--cyan); box-shadow: 0 0 50px rgba(0,212,255,.3); }
    .timer-wrap.done { border-color:var(--gold); }
    
    .time-target {
      position:absolute; top:3rem; font-size:1rem; font-weight:800;
      color:rgba(255,255,255,.4); letter-spacing:2px;
    }
    
    .time-display {
      font-size:clamp(3.5rem, 12vw, 5.5rem); font-weight:900;
      font-variant-numeric: tabular-nums; /* Monospace numbers */
      color:var(--text); letter-spacing:-2px;
    }

    /* ── Action Button ── */
    .action-btn {
      margin-top: 1rem; position:relative; z-index:1;
      width:min(300px, 100% - 2rem); height:70px;
      border:none; border-radius:20px;
      font-family:inherit; font-size:1.6rem; font-weight:900;
      cursor:pointer; transition:all .1s;
      background:linear-gradient(135deg,var(--accent),var(--pink));
      color:#fff; box-shadow:0 8px 30px rgba(108,58,255,.4);
      user-select:none; -webkit-tap-highlight-color:transparent;
    }
    .action-btn:active { transform:scale(0.96); box-shadow:0 4px 15px rgba(108,58,255,.3); }
    .action-btn.btn-stop {
      background:linear-gradient(135deg, #ff3aac, #ff4444);
      box-shadow:0 8px 30px rgba(255,58,172,.4);
    }

    /* ── Result ── */
    .result-zone {
      text-align:center; margin-top:1.5rem; z-index:1; position:relative;
      min-height: 100px; opacity: 0; transition: opacity .4s ease;
    }
    .result-zone.show { opacity: 1; }
    .diff-text { font-size:2.4rem; font-weight:900; line-height:1; margin-bottom:.3rem; }
    .rating-text { font-size:1.3rem; font-weight:800; }
    .record-text { font-size:.85rem; color:var(--dim); margin-top:.5rem; }

    .s  { color:var(--gold); }
    .a  { color:var(--cyan); }
    .b  { color:var(--green); }
    .cc { color:#ff9500; }
    .d  { color:var(--red); }

    /* ── Leaderboard ── */
    .lb-section {
      width:min(500px, 100% - 2rem); margin: 3rem auto 2rem;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:1.5rem; position:relative; z-index:1;
    }
    .lb-warning {
      background:rgba(255,68,68,.1); border:1px solid rgba(255,68,68,.3);
      color:#ffaaaa; font-size:.75rem; padding:.8rem; border-radius:8px;
      margin-bottom:1.5rem; line-height:1.4; text-align:center; word-break:keep-all;
    }
    .lb-header { text-align:center; margin-bottom:1rem; }
    .lb-header h2 { font-size:1.4rem; color:var(--gold); display:flex; align-items:center; justify-content:center; gap:.5rem; }
    
    .lb-tabs { display:flex; gap:.4rem; justify-content:center; margin-bottom:1rem; flex-wrap:wrap; }
    .lb-tab {
      background:transparent; border:1px solid rgba(255,255,255,.2); color:var(--dim);
      padding:.3rem .8rem; border-radius:20px; font-size:.75rem; cursor:pointer; font-family:inherit; transition:all .2s;
    }
    .lb-tab.active { background:var(--gold); color:#000; border-color:var(--gold); font-weight:800; }
    
    .lb-list { display:flex; flex-direction:column; gap:.4rem; min-height:150px; }
    .lb-item {
      display:flex; align-items:center; background:rgba(0,0,0,.3); padding:.6rem 1rem;
      border-radius:10px; font-size:.9rem;
    }
    .lb-item.empty { justify-content:center; color:var(--dim); font-size:.8rem; font-style:italic; }
    .lb-rank { width:24px; font-weight:900; color:var(--dim); }
    .lb-item:nth-child(1) .lb-rank { color:var(--gold); }
    .lb-item:nth-child(2) .lb-rank { color:#c0c0c0; }
    .lb-item:nth-child(3) .lb-rank { color:#cd7f32; }
    .lb-name { flex:1; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:1rem; }
    .lb-score { font-family:monospace; font-size:.95rem; color:var(--cyan); font-weight:700; }

    
    
    
    
    @media (max-width:1300px) {  }
  
    /* AdSense 사이드바 */
    .ad-sidebar { position:fixed; top:120px; height:600px; width:160px; z-index:10; }
    .ad-left  { left: calc(50% - 550px); }
    .ad-right { right: calc(50% - 550px); }
    @media (max-width: 1150px) { .ad-sidebar { display:none !important; } }
  </style>

</head>
<body>

<div class="ad-sidebar ad-left">
  <ins class="adsbygoogle" style="display:block;width:160px;height:600px"
    data-ad-client="ca-pub-1363977997493751" data-ad-slot="XXXXXXXXXX"></ins>

</div>
<div class="ad-sidebar ad-right">
  <ins class="adsbygoogle" style="display:block;width:160px;height:600px"
    data-ad-client="ca-pub-1363977997493751" data-ad-slot="XXXXXXXXXX"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<header>
  <a href="index.html" class="btn-home">← 홈으로</a>
  <h1>⏱️ 눈 감고 초 맞추기</h1>
  <p>타이머는 3초부터 서서히 사라집니다. 목표 시간에 정확히 멈추세요!</p>
</header>

<div class="controls" id="controls">
  <div class="ctrl-label">목표 시간 선택</div>
  <div class="btn-row" id="timeOpts">
    <button class="opt-btn active" data-time="10">10초</button>
    <button class="opt-btn" data-time="15">15초</button>
    <button class="opt-btn" data-time="30">30초</button>
    <button class="opt-btn" data-time="60">60초</button>
    <button class="opt-btn" id="customBtn">커스텀</button>
  </div>
</div>

<div class="timer-wrap" id="timerWrap">
  <div class="time-target" id="targetDisp">목표: 10.000초</div>
  <div class="time-display" id="timeDisp">0.000</div>
</div>

<button class="action-btn" id="actionBtn">시작!</button>

<div class="result-zone" id="resultZone">
  <div class="diff-text" id="diffText"></div>
  <div class="rating-text" id="ratingText"></div>
  <div class="record-text" id="recordText"></div>
</div>

<div class="lb-section">
  <div class="lb-warning">
    ⚠️ <b>정정당당한 승부!</b><br>
    클라이언트 변조를 통한 비정상적인 스코어 조작은 모든 참여자의 재미를 반감시킵니다. 양심적인 플레이를 부탁드립니다.
  </div>
  <div class="lb-header"><h2>🏆 오늘의 TOP 10</h2></div>
  <div class="lb-tabs" id="lbTabs">
    <button class="lb-tab active" data-cat="time_10">10초</button>
    <button class="lb-tab" data-cat="time_15">15초</button>
    <button class="lb-tab" data-cat="time_30">30초</button>
    <button class="lb-tab" data-cat="time_60">60초</button>
  </div>
  <div class="lb-list" id="lbList">
    <div class="lb-item empty">랭킹 불러오는 중...</div>
  </div>
</div>

<script>
let targetTime = 10;
let state = 'idle'; // idle | running | done
let startTime = 0;
let reqId = null;

const timeOpts   = document.getElementById('timeOpts');
const customBtn  = document.getElementById('customBtn');
const targetDisp = document.getElementById('targetDisp');
const timeDisp   = document.getElementById('timeDisp');
const timerWrap  = document.getElementById('timerWrap');
const actionBtn  = document.getElementById('actionBtn');
const resultZone = document.getElementById('resultZone');

const diffText   = document.getElementById('diffText');
const ratingText = document.getElementById('ratingText');
const recordText = document.getElementById('recordText');

let bestDiffs = JSON.parse(localStorage.getItem('stc_bests') || '{}');

function formatMs(sec) {
  return sec.toFixed(3);
}

function updateBestDisplay() {
  const best = bestDiffs[targetTime];
  if (best !== undefined) {
    recordText.textContent = `이 모드 최고 기록: 오차 ${formatMs(best)}초`;
  } else {
    recordText.textContent = `이 모드 기록 없음`;
  }
}

function selectTime(ms) {
  if (state === 'running') return;
  if (window.sfAudio) window.sfAudio.play('tap');
  targetTime = ms;
  targetDisp.textContent = `목표: ${formatMs(targetTime)}초`;
  
  // Update UI buttons
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
  const targetBtn = document.querySelector(`.opt-btn[data-time="${ms}"]`);
  if (targetBtn) {
    targetBtn.classList.add('active');
    customBtn.textContent = '커스텀';
  } else {
    customBtn.classList.add('active');
    customBtn.textContent = `${ms}초`;
  }
  
  resetTimer();
  updateBestDisplay();
}

// ── Events ────────────────────────────────
timeOpts.addEventListener('click', e => {
  const btn = e.target.closest('.opt-btn');
  if (!btn) return;
  
  if (btn.id === 'customBtn') {
    requestCustomTime();
  } else {
    selectTime(parseFloat(btn.dataset.time));
  }
});

function requestCustomTime() {
  if (state === 'running') return;
  if (window.sfAudio) window.sfAudio.play('tap');
  const raw = prompt("목표 시간을 입력하세요 (최소 10초, 소수점 가능):", "10");
  if (!raw) return;
  
  const val = parseFloat(raw);
  if (isNaN(val) || val < 10) {
    alert("10초 이상의 숫자를 입력해주세요!");
    return;
  }
  selectTime(val);
}

// ── Game Loop ─────────────────────────────
function resetTimer() {
  state = 'idle';
  cancelAnimationFrame(reqId);
  timeDisp.textContent = '0.000';
  timeDisp.style.opacity = '1';
  timerWrap.classList.remove('running', 'done');
  actionBtn.textContent = '시작!';
  actionBtn.className = 'action-btn';
  resultZone.classList.remove('show');
}

function startTimer() {
  state = 'running';
  if (window.sfAudio) window.sfAudio.play('tick');
  resultZone.classList.remove('show');
  timerWrap.classList.remove('done');
  timerWrap.classList.add('running');
  actionBtn.textContent = '정지!';
  actionBtn.className = 'action-btn btn-stop';
  
  startTime = performance.now();
  reqId = requestAnimationFrame(updateTimer);
}

function updateTimer(now) {
  if (state !== 'running') return;
  
  const elapsed = (now - startTime) / 1000;
  timeDisp.textContent = formatMs(elapsed);
  
  // Fade out logic:
  // < 3s: opacity 1
  // 3s ~ 5s: opacity 1 -> 0
  // > 5s: opacity 0
  if (elapsed < 3) {
    timeDisp.style.opacity = '1';
  } else if (elapsed <= 5) {
    const ratio = 1 - ((elapsed - 3) / 2);
    timeDisp.style.opacity = ratio.toFixed(3);
  } else {
    timeDisp.style.opacity = '0';
  }
  
  reqId = requestAnimationFrame(updateTimer);
}

function stopTimer() {
  state = 'done';
  cancelAnimationFrame(reqId);
  const endTime = performance.now();
  const elapsed = (endTime - startTime) / 1000;
  
  if (window.sfAudio) window.sfAudio.play('result');

  timeDisp.textContent = formatMs(elapsed);
  timeDisp.style.opacity = '1'; // Reveal instantly
  timerWrap.classList.remove('running');
  timerWrap.classList.add('done');
  actionBtn.textContent = '다시 하기';
  actionBtn.className = 'action-btn';
  
  showResult(elapsed);
}

function getRating(diff) {
  if (diff <= 0.050) return { cls: 's', label: '🌟 신의 영역 (PERFECT)' };
  if (diff <= 0.200) return { cls: 'a', label: '✨ 미친 감각 (GREAT)' };
  if (diff <= 0.500) return { cls: 'b', label: '👍 훌륭함 (GOOD)' };
  if (diff <= 1.000) return { cls: 'cc', label: '😅 조금 아쉽네 (CLOSE)' };
  return { cls: 'd', label: '💀 시간 관념 상실 (MISSED)' };
}

function showResult(elapsed) {
  const diff = Math.abs(elapsed - targetTime);
  const { cls, label } = getRating(diff);
  
  diffText.innerHTML = `오차 <span class="${cls}">${formatMs(diff)}</span>초`;
  ratingText.className = `rating-text ${cls}`;
  ratingText.textContent = label;
  
  // Best check
  const prevBest = bestDiffs[targetTime];
  if (prevBest === undefined || diff < prevBest) {
    bestDiffs[targetTime] = diff;
    localStorage.setItem('stc_bests', JSON.stringify(bestDiffs));
    recordText.innerHTML = `🏆 새로운 최고 기록 달성!`;
  } else {
    recordText.textContent = `이 모드 최고 기록: 오차 ${formatMs(prevBest)}초`;
  }
  
  resultZone.classList.add('show');

  // Check and save score to DB
  if ([10, 15, 30, 60].includes(targetTime)) {
    const cat = `time_${targetTime}`;
    setTimeout(async () => {
      if (!window.dbAPI) return;
      const isTop = await window.dbAPI.isTop10('stopwatch', cat, diff, 'asc');
      if (isTop) {
        const name = window.dbAPI.getGuestId();
        await window.dbAPI.saveScore('stopwatch', cat, name, diff, `${diff.toFixed(3)}s`, 'asc');
        if (currentLbCat === cat) loadLeaderboard(cat);
      }
    }, 500);
  }
}

// Button Click
actionBtn.addEventListener('click', () => {
  if (state === 'idle') {
    startTimer();
  } else if (state === 'running') {
    stopTimer();
  } else if (state === 'done') {
    resetTimer();
  }
});

// ── Leaderboard Logic ─────────────────────
let currentLbCat = `time_10`;
function loadLeaderboard(cat = currentLbCat) {
  currentLbCat = cat;
  document.querySelectorAll('.lb-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  const list = document.getElementById('lbList');
  list.innerHTML = '<div class="lb-item empty">데이터를 불러오는 중...</div>';
  
  if (!window.dbAPI) {
    setTimeout(() => loadLeaderboard(cat), 100);
    return;
  }
  
  window.dbAPI.getTop10('stopwatch', cat, 'asc').then(data => {
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="lb-item empty">아직 기록이 없습니다. 첫 랭커가 되어보세요!</div>';
      return;
    }
    list.innerHTML = data.map((d, i) => `
      <div class="lb-item">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-name">${d.name}</span>
        <span class="lb-score">${d.extraText}</span>
      </div>
    `).join('');
  });
}
document.getElementById('lbTabs').addEventListener('click', e => {
  if(e.target.classList.contains('lb-tab')) loadLeaderboard(e.target.dataset.cat);
});

// Init
selectTime(10);
loadLeaderboard();
</script>
</body>
</html>

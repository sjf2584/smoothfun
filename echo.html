<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리듬 기억 테스트 : 에코 챔버 | 스무스펀</title>
  <meta name="description" content="들려오는 박자를 그대로 기억하고 재현하세요! 리듬감과 청각 타이밍 감각을 동시에 테스트하는 에코 챔버 게임입니다.">
  <meta name="keywords" content="리듬 기억, 박자 게임, 청각 타이밍, 리듬게임, 단기 기억력">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080816; --surface:#0f0f28; --surface2:#181840;
      --accent:#6c3aff; --cyan:#00d4ff; --pink:#ff3aac;
      --gold:#ffd700; --text:#e8e8ff; --dim:#6060a0;
      --green:#00ff88; --red:#ff4444;
    }
    :root[data-theme="light"] {
      --bg:#f0f2ff; --surface:#ffffff; --surface2:#e8eaff;
      --accent:#5b2de0; --cyan:#0099cc; --pink:#cc2299;
      --gold:#b8860b; --text:#1a1a3a; --dim:#8080b0;
      --green:#00aa55; --red:#cc2222;
    }
    :root[data-theme="light"] body::before { background:none; }
    :root[data-theme="light"] .pad { background:#ffffff; box-shadow:0 15px 35px rgba(0,0,0,.1), inset 0 0 0 8px rgba(91,45,224,.1); }
    :root[data-theme="light"] .tog-btn { background:#f0f2ff; color:var(--text); border-color:rgba(0,0,0,.15); }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Outfit','Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; overflow-x:hidden; padding-bottom:2rem;
      user-select:none; touch-action:manipulation;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(108,58,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 90%, rgba(255,58,172,.1) 0%, transparent 60%);
    }

    header { text-align:center; padding:4.5rem 1rem .5rem; z-index:1; position:relative; }
    header h1 {
      font-size:clamp(1.8rem,5vw,3rem); font-weight:900;
      background:linear-gradient(135deg,var(--pink),var(--accent),var(--cyan));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    header p { color:var(--dim); font-size:.9rem; margin-top:.4rem; }

    .btn-home {
      display: inline-block; position: absolute; left: 1rem; top: 1rem;
      padding: .4rem .8rem; border-radius: 8px; font-size: .8rem; font-weight: 700;
      color: var(--cyan); text-decoration: none; border: 1px solid rgba(0,212,255,.3);
      transition: all .2s;
    }
    .btn-home:hover { background: rgba(0,212,255,.1); }

    /* ── Controls ── */
    .controls {
      display:flex; flex-direction:column; gap:.7rem;
      margin:.5rem 0 1rem; padding:0 1rem; z-index:1; position:relative;
      width:min(520px, 100%);
    }
    .ctrl-row { display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; }
    .tog-btn {
      padding:.5rem 1.1rem; border:1.5px solid rgba(108,58,255,.3);
      background:var(--surface); border-radius:10px; cursor:pointer;
      font-family:inherit; font-size:.85rem; color:var(--dim);
      transition:all .2s; font-weight:600; flex:1; max-width:200px;
      white-space:nowrap; /* 텍스트 줄바꿼 금지 */
    }
    .tog-btn:hover { border-color:var(--accent); color:var(--text); }
    /* Dark mode selected: pink glow (original style) */
    .tog-btn.active {
      background:linear-gradient(135deg,rgba(108,58,255,.3),rgba(255,58,172,.15));
      border-color:var(--pink); color:#fff; font-weight:700;
      box-shadow:0 0 14px rgba(255,58,172,.3);
    }
    /* Light mode: distinct filled style that still feels "light" */
    :root[data-theme="light"] .tog-btn {
      background:#fff; color:#6060a0; border-color:rgba(91,45,224,.2);
    }
    :root[data-theme="light"] .tog-btn:hover {
      border-color:var(--accent); color:var(--accent);
    }
    :root[data-theme="light"] .tog-btn.active {
      background:rgba(91,45,224,.1); /* 연한 보라 튴트 배경 */
      border:2.5px solid var(--accent); /* 진한 테두리 */
      color:var(--accent); font-weight:800;
      box-shadow:0 0 0 3px rgba(91,45,224,.12); /* 바깥족 글로우 */
    }
    :root[data-theme="light"] .tog-btn.active::before {
      content:'● '; font-size:.6rem; /* 선택 점 표시자 */
    }

    /* ── Game Area ── */
    .game-zone {
      display:flex; flex-direction:column; align-items:center;
      z-index:1; position:relative; width:100%; margin-top:1rem;
    }
    .level-disp {
      font-size:2rem; font-weight:900; color:var(--cyan);
      letter-spacing:1px; margin-bottom:.2rem;
    }
    .best-disp {
      font-size:.8rem; color:var(--dim); margin-bottom:.4rem;
    }
    .state-disp {
      font-size:1.1rem; font-weight:800; color:var(--text);
      min-height:30px; margin-bottom:1rem; transition:color .3s;
    }
    /* Beat dots */
    .beat-track {
      display:flex; gap:8px; justify-content:center; align-items:center;
      margin-bottom:1.2rem; min-height:20px; flex-wrap:wrap; max-width:320px;
    }
    /* Acc chip zone — fixed height inside game-zone */
    .acc-zone {
      min-height:66px; width:100%; max-width:600px;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:.5rem;
    }
    .beat-dot {
      width:14px; height:14px; border-radius:50%;
      background:rgba(108,58,255,.25); border:2px solid rgba(108,58,255,.4);
      transition:background .1s, transform .1s;
    }
    .beat-dot.lit {
      background:var(--accent);
      box-shadow:0 0 10px var(--accent);
      transform:scale(1.3);
    }
    .beat-dot.player-lit {
      background:var(--cyan);
      box-shadow:0 0 10px var(--cyan);
      transform:scale(1.3);
    }
    .beat-dot.ok { background:var(--green); border-color:var(--green); box-shadow:0 0 8px var(--green); }
    .beat-dot.fail { background:var(--red); border-color:var(--red); box-shadow:0 0 8px var(--red); }

    /* The Pad */
    .pad-container {
      position:relative;
      width:min(70vw, 260px); height:min(70vw, 260px);
    }

    .pad {
      width:100%; height:100%; border-radius:50%;
      background:var(--surface2);
      box-shadow:0 20px 50px rgba(0,0,0,.4), inset 0 0 0 12px rgba(108,58,255,.2);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transform:scale(1); transition:transform .1s, background .15s, box-shadow .15s;
      outline:none; -webkit-tap-highlight-color:transparent;
      position:relative; z-index:2;
    }
    
    .pad-content {
      font-size:1.8rem; font-weight:900; color:var(--dim);
      letter-spacing:2px; pointer-events:none; transition:color .15s;
    }

    /* states */
    .pad.active { transform:scale(0.95); }
    .pad.flash-sys {
      background:rgba(108,58,255,.5);
      box-shadow:0 0 40px rgba(108,58,255,.6), inset 0 0 0 12px rgba(108,58,255,.8);
    }
    .pad.flash-sys .pad-content { color:#fff; }

    .pad.flash-player {
      background:rgba(0,212,255,.5);
      box-shadow:0 0 40px rgba(0,212,255,.6), inset 0 0 0 12px rgba(0,212,255,.8);
    }
    .pad.flash-player .pad-content { color:#fff; }

    .pad.flash-fail {
      background:rgba(255,68,68,.5) !important;
      box-shadow:0 0 40px rgba(255,68,68,.6), inset 0 0 0 12px rgba(255,68,68,.8) !important;
    }
    .pad.flash-success {
      background:rgba(0,255,136,.5) !important;
      box-shadow:0 0 40px rgba(0,255,136,.6), inset 0 0 0 12px rgba(0,255,136,.8) !important;
    }

    /* Ripple Effect */
    .ripple {
      position:absolute; inset:0; border-radius:50%;
      border:4px solid var(--accent); opacity:0;
      pointer-events:none; z-index:1;
    }
    .ripple.anim { animation:ripple-out 0.8s ease-out; }
    @keyframes ripple-out {
      0% { transform:scale(1); opacity:0.8; border-width:8px; }
      100% { transform:scale(1.8); opacity:0; border-width:1px; }
    }

    .ripple.player { border-color:var(--cyan); }
    .ripple.fail { border-color:var(--red); }
    .ripple.success { border-color:var(--green); }


    .result-box { animation:fadeUp .4s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .start-btn {
      padding:.8rem 2rem; border:none; border-radius:14px;
      font-family:inherit; font-size:1.2rem; font-weight:800; cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--pink)); color:#fff;
      box-shadow:0 6px 20px rgba(108,58,255,.4); transition:all .2s;
    }
    .start-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(108,58,255,.5); }

    /* 팸드 오버레이 — 게임오버 시 패드 위에 버튼 표시 */
    .pad-overlay {
      position:absolute; inset:0; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      z-index:10; pointer-events:none;
      background:transparent;
      transition:background .25s;
    }
    .pad-overlay.active {
      pointer-events:auto;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(3px);
    }
    .pad-overlay .start-btn {
      opacity:0; transform:scale(.8);
      transition:opacity .2s, transform .2s;
    }
    .pad-overlay.active .start-btn {
      opacity:1; transform:scale(1);
    }

    .tol-disp { margin-top:1.5rem; font-size:.85rem; color:var(--dim); }

    /* ── Key guide (side panel) ── */
    .pad-row {
      display:flex; align-items:center; justify-content:center;
      gap:2rem; flex-wrap:wrap; width:100%;
    }
    .key-guide {
      display:flex; flex-direction:column; align-items:center;
      gap:.7rem; padding:.8rem 1rem;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07);
      border-radius:14px; min-width:90px;
    }
    .key-guide-title {
      font-size:.6rem; font-weight:700; color:var(--dim);
      letter-spacing:.1em; text-transform:uppercase;
    }
    .key-group { display:flex; flex-direction:column; align-items:center; gap:.35rem; }
    .key-label { font-size:.6rem; font-weight:700; color:var(--dim); letter-spacing:.06em; }
    .keys { display:flex; gap:.3rem; flex-wrap:wrap; justify-content:center; }
    .key {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:30px; height:30px; padding:0 .4rem; border-radius:6px;
      background:var(--surface2); border:1.5px solid rgba(255,255,255,.15);
      font-size:.8rem; font-weight:800; color:var(--text);
      box-shadow:0 3px 0 rgba(0,0,0,.4);
      transition:all .1s;
    }
    .key-wide { min-width:70px; font-size:.7rem; }
    .key.lit {
      background:var(--accent); border-color:var(--accent); color:#fff;
      box-shadow:0 0 12px rgba(108,58,255,.5), 0 1px 0 rgba(0,0,0,.4);
      transform:translateY(2px);
    }
    .key-sep { font-size:.65rem; color:var(--dim); opacity:.5; }

    /* ── Per-beat accuracy table ── */
    /* ── Per-beat accuracy table: single horizontal scrollable row ── */
    .acc-table {
      display:flex; gap:.45rem;
      overflow-x:auto; /* horizontal scroll if many chips */
      flex-wrap:nowrap; /* never wrap — always one line */
      margin:.8rem 0 1.2rem;
      padding:.4rem .2rem; /* breathing room for shadows */
      max-width:100%;
      /* hide scrollbar but still scrollable */
      scrollbar-width:none;
    }
    .acc-table::-webkit-scrollbar { display:none; }
    .acc-chip {
      display:flex; flex-direction:column; align-items:center;
      gap:.15rem; padding:.4rem .55rem; border-radius:10px;
      font-size:.75rem; font-weight:700; min-width:50px;
      flex-shrink:0; /* never shrink — keeps width consistent */
      border:1.5px solid;
    }
    .acc-chip.ok  { background:rgba(0,255,136,.12); border-color:rgba(0,255,136,.4); color:var(--green); }
    .acc-chip.bad { background:rgba(255,68,68,.12);  border-color:rgba(255,68,68,.4);  color:var(--red); }
    .acc-chip .beat-num { font-size:.62rem; opacity:.6; }
    .acc-chip .beat-val { font-size:.9rem; }

    
    
    
    
    @media (max-width:1300px) {  }

    /* ── Leaderboard ── */
    .lb-section {
      width:min(600px, 100% - 2rem); margin: 2rem auto 2rem;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:1.5rem; position:relative; z-index:1;
    }
    .lb-header { text-align:center; margin-bottom:1rem; }
    .lb-header h2 { font-size:1.4rem; color:var(--gold); }
    .lb-tabs { display:flex; gap:.4rem; justify-content:center; margin-bottom:1rem; flex-wrap:wrap; }
    .lb-tab {
      background:transparent; border:1px solid rgba(255,255,255,.2); color:var(--dim);
      padding:.3rem .8rem; border-radius:20px; font-size:.75rem; cursor:pointer; font-family:inherit; transition:all .2s;
    }
    .lb-tab.active { background:var(--gold); color:#000; border-color:var(--gold); font-weight:800; }
    .lb-list { display:flex; flex-direction:column; gap:.4rem; min-height:150px; }
    .lb-item {
      display:flex; align-items:center; background:rgba(0,0,0,.3); padding:.6rem 1rem;
      border-radius:10px; font-size:.9rem;
    }
    .lb-item.empty { justify-content:center; color:var(--dim); font-size:.8rem; font-style:italic; }
    .lb-rank { width:24px; font-weight:900; color:var(--dim); }
    .lb-item:nth-child(1) .lb-rank { color:var(--gold); }
    .lb-item:nth-child(2) .lb-rank { color:#c0c0c0; }
    .lb-item:nth-child(3) .lb-rank { color:#cd7f32; }
    .lb-name { flex:1; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:1rem; }
    .lb-score { font-family:monospace; font-size:.95rem; color:var(--cyan); font-weight:700; }
  
    /* AdSense 사이드바 */
    .ad-sidebar { position:fixed; top:120px; height:600px; width:160px; z-index:10; }
    .ad-left  { left: calc(50% - 550px); }
    .ad-right { right: calc(50% - 550px); }
    @media (max-width: 1150px) { .ad-sidebar { display:none !important; } }
  </style>

<script>
// ── Web Audio Synth (Echo-dedicated, lightweight) ──
// Node pool: max 4 simultaneous nodes → no memory leak on rapid tapping
const synth = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  // type: 'sys' | 'player' | 'fail' | 'success'
  playTap(type) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);

    switch (type) {
      case 'sys':     // 낮은 킥: 컴퓨터 패턴
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
        gain.gain.setValueAtTime(0.7, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.15); break;

      case 'player':  // 맑은 탭: 플레이어 입력
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.08);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.start(t); osc.stop(t + 0.08); break;

      case 'success': // 띵~ 성공
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.linearRampToValueAtTime(1200, t + 0.15);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t); osc.stop(t + 0.3); break;

      case 'fail':    // 웅~ 실패
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(55, t + 0.4);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.start(t); osc.stop(t + 0.4); break;
    }
  }
};
// AudioContext 유저 제스처 필요 — pointer 와 keyboard 양쪽 모두 초기화
document.addEventListener('pointerdown', () => synth.init(), {once: true});
document.addEventListener('keydown',      () => synth.init(), {once: true});

// ── State ──
let mode = 'normal';
let level = 1;
let gameState = 'idle'; // idle | sys-playing | wait-player | player-turn | over
let targets = [];          // intervals[] in ms
let expectedTaps = 0;
let playerTaps = [];       // performance.now() timestamps[]
let playerIntervals = [];  // actual measured intervals per beat
const tolerance = 100;     // ms — fixed, never scales
let sessionBest = 0;
let playerTapDots = 0;     // how many dots lit so far in player turn
let inputTimeout = null;

let rippleIdx = 1;

const pad        = document.getElementById('tapPad');
const stateDisp  = document.getElementById('stateDisp');
const levelDisp  = document.getElementById('levelDisp');
const bestDisp   = document.getElementById('bestDisp');
const padOverlay = document.getElementById('padOverlay'); // 패드 오버레이 — 버튼 표시
const accZone    = document.getElementById('accZone');
const beatTrack  = document.getElementById('beatTrack');

// ── Ripple ──
function doRipple(type) {
  const r = document.getElementById('ripple' + rippleIdx);
  rippleIdx = rippleIdx === 1 ? 2 : 1;
  r.classList.remove('anim','player','fail','success');
  void r.offsetWidth;
  if (type !== 'sys') r.classList.add(type);
  r.classList.add('anim');
}

// ── Pad flash ──
function padFlash(type) {
  pad.classList.remove('flash-sys','flash-player','flash-fail','flash-success');
  void pad.offsetWidth;
  pad.classList.add('flash-' + type);
  synth.playTap(type);
  setTimeout(() => pad.classList.remove('flash-' + type), 130);
  doRipple(type);
}

// ── Beat track dots ──
function buildBeatDots(n) {
  beatTrack.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'beat-dot';
    d.id = 'dot-' + i;
    beatTrack.appendChild(d);
  }
}

function litDot(i, cls) {
  const d = document.getElementById('dot-' + i);
  if (!d) return;
  d.classList.remove('lit','player-lit','ok','fail');
  if (cls) d.classList.add(cls); // guard: never classList.add('')
}

// ── Mode selector ──
document.getElementById('modeRow').addEventListener('click', e => {
  if (gameState !== 'idle' && gameState !== 'over') return;
  const btn = e.target.closest('.tog-btn');
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#modeRow .tog-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadLeaderboard(`echo_${mode}`);
  sessionBest = 0;
  bestDisp.textContent = '최고 기록: -';
});

// ── Pattern generator ──
function generatePattern(lvl) {
  // Tap count grows every 2 levels: lv1→2taps, lv3→3taps, lv5→4taps … cap at 10
  expectedTaps = Math.min(10, 2 + Math.floor((lvl - 1) / 2));
  const n = expectedTaps - 1;
  targets = [];

  if (mode === 'normal') {
    // 엄박 없는 순수 박자 (120BPM grid: 8단음=250ms, 4다논=500ms, 2다논=1000ms)
    // 파트론을 미리 정의하여 리듬감 있도록 선택
    const patterns = [
      [500, 500],             // 블래크 (직선 2타)
      [250, 250, 500],        // 틤틤-틤
      [500, 250, 250],        // 틤-틤틤
      [250, 500, 250],        // 틤-로구-틤
      [250, 250, 250, 250],   // 16분음 4분할
      [500, 500, 500],        // 직선 3타
      [250, 250, 250, 500],   // 틤틤틤-
      [500, 250, 250, 250],   // -틤틤틤
      [1000, 500],            // 길게-짧게
      [500, 1000],            // 짧게-길게
      [250, 250, 500, 500],   // 빨리빨리-느리
      [500, 500, 250, 250],   // 느리-빨리
    ];
    // n개의 인터발이 필요하며, 파트론 여러 개를 이어붙여 스케일
    while (targets.length < n) {
      const pool = patterns.filter(p => p.length <= n - targets.length);
      // 테이블이 비어있으면 단돈 값으로
      if (!pool.length) {
        targets.push([250, 500][Math.floor(Math.random() * 2)]);
      } else {
        const pat = pool[Math.floor(Math.random() * pool.length)];
        // 레벨이 높아질수록 빠른 패턴에 가중치 부여
        targets.push(...pat);
      }
    }
    // 정확히 n개로 자름
    targets = targets.slice(0, n);
  } else {
    // Hard mode: truly random 200ms-1000ms
    for (let i = 0; i < n; i++) {
      targets.push(Math.round((Math.random() * 800 + 200) / 50) * 50);
    }
  }
}

// ── Start game ──
function startGame() {
  level = 1;
  // 오버레이 비활성화
  padOverlay.classList.remove('active');
  padOverlay.innerHTML = '';
  accZone.innerHTML = '';
  startLevel();
}

// ── Level loop ──
async function startLevel() {
  // clear any pending timeout
  if (inputTimeout) { clearTimeout(inputTimeout); inputTimeout = null; }

  // 오버레이 숨김 — 패드 노출
  padOverlay.classList.remove('active');
  padOverlay.innerHTML = '';

  levelDisp.textContent = `LEVEL ${level}`;
  // tolerance is fixed at 100ms — no per-level scaling

  generatePattern(level);
  playerTaps = [];
  playerIntervals = [];
  playerTapDots = 0;

  buildBeatDots(expectedTaps);

  gameState = 'sys-playing';
  stateDisp.textContent = '잘 들으세요... 🤫';
  stateDisp.style.color = 'var(--accent)';

  await sleep(800);

  // System plays pattern
  // Each tap fires at t=0, t=targets[0], t=targets[0]+targets[1], ...
  // Dimming happens in background via setTimeout (non-blocking)
  for (let i = 0; i < expectedTaps; i++) {
    padFlash('sys');
    litDot(i, 'lit');
    // dim dot after 150ms in background — does NOT block the interval timing
    setTimeout(() => litDot(i, null), 150);
    // wait the full interval before the NEXT tap
    if (i < expectedTaps - 1) await sleep(targets[i]);
  }

  gameState = 'wait-player';
  stateDisp.textContent = '따라 하세요! 👈';
  stateDisp.style.color = 'var(--cyan)';

  // Auto-fail if no input for 4 seconds
  inputTimeout = setTimeout(() => {
    if (gameState === 'wait-player' || gameState === 'player-turn') {
      padFlash('fail');
      gameOver(9999, 0, true);
    }
  }, 5000);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ── Tap handling — shared logic ──
function handleTap() {
  if (gameState !== 'wait-player' && gameState !== 'player-turn') return;

  const now = performance.now();

  if (gameState === 'wait-player') {
    // First tap — start
    if (inputTimeout) { clearTimeout(inputTimeout); inputTimeout = null; }
    gameState = 'player-turn';
    playerTaps.push(now);
    litDot(playerTapDots, 'player-lit');
    playerTapDots++;
    padFlash('player');

    // Set timeout for subsequent tap
    inputTimeout = setTimeout(() => {
      if (gameState === 'player-turn') { padFlash('fail'); gameOver(true); }
    }, targets[0] + tolerance + 500);
    return;
  }

  // Subsequent taps
  if (inputTimeout) { clearTimeout(inputTimeout); inputTimeout = null; }

  const tapIndex    = playerTaps.length - 1;
  const interval    = now - playerTaps[tapIndex];
  const target      = targets[tapIndex];
  const diff        = Math.round(interval - target); // signed: +overshoot, -undershoot
  const absDiff     = Math.abs(diff);
  playerTaps.push(now);
  playerIntervals.push({ target, actual: Math.round(interval), diff });

  if (absDiff > tolerance) {
    litDot(playerTapDots, 'fail');
    padFlash('fail');
    gameOver(false);
  } else {
    litDot(playerTapDots, 'ok');
    playerTapDots++;

    if (playerTaps.length === expectedTaps) {
      padFlash('success');
      levelComplete();
    } else {
      padFlash('player');
      const nextTarget = targets[tapIndex + 1] || 1000;
      inputTimeout = setTimeout(() => {
        if (gameState === 'player-turn') { padFlash('fail'); gameOver(true); }
      }, nextTarget + tolerance + 500);
    }
  }
}

// Pointer (mouse / touch) — 클릭은 게임 중 탭만 (시작/재시작은 Enter 전용)
pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  pad.classList.add('active');
  handleTap(); // idle/over 상태면 handleTap 내부에서 무시됨
});
pad.addEventListener('pointerup',    () => pad.classList.remove('active'));
pad.addEventListener('pointerleave', () => pad.classList.remove('active'));

// Keyboard
const ALLOWED_KEYS = new Set(['KeyS','KeyD','KeyF','KeyJ','KeyK','KeyL','Space']);
document.addEventListener('keydown', e => {
  if (e.repeat) return;

  // Enter 전용 — 시작 / 재시작
  if (e.code === 'Enter') {
    e.preventDefault();
    if (gameState === 'idle' || gameState === 'over') startGame();
    return;
  }

  // 탭 키 — 게임 중(wait-player / player-turn)에만 반응
  if (!ALLOWED_KEYS.has(e.code)) return;
  e.preventDefault();
  if (gameState !== 'wait-player' && gameState !== 'player-turn') return; // idle/over 무시
  pad.classList.add('active');
  const keyEl = document.querySelector(`.key[data-key="${e.code}"]`);
  if (keyEl) keyEl.classList.add('lit');
  handleTap();
});
document.addEventListener('keyup', e => {
  if (!ALLOWED_KEYS.has(e.code)) return;
  pad.classList.remove('active');
  const keyEl = document.querySelector(`.key[data-key="${e.code}"]`);
  if (keyEl) keyEl.classList.remove('lit');
});



// ── Accuracy table html builder ──
function buildAccuracyHTML(intervals, failed) {
  if (!intervals.length) return '';
  const chips = intervals.map((iv, i) => {
    // The last recorded interval is the one that failed (if failed)
    const isFailed = failed && i === intervals.length - 1;
    const sign = iv.diff >= 0 ? '+' : '';
    const cls  = isFailed ? 'bad' : 'ok';
    return `<div class="acc-chip ${cls}">
      <span class="beat-num">${i + 1}번째</span>
      <span class="beat-val">${sign}${iv.diff}ms</span>
    </div>`;
  }).join('');
  return `<div class="acc-table">${chips}</div>`;
}

// ── Game Over ──
function gameOver(isTimeout) {
  gameState = 'over';
  if (inputTimeout) { clearTimeout(inputTimeout); inputTimeout = null; }

  stateDisp.textContent = isTimeout ? '💀 시간 초과!' : '💀 실패!';
  stateDisp.style.color = 'var(--red)';

  const reached = level;
  if (reached > sessionBest) {
    sessionBest = reached;
    bestDisp.textContent = `최고 기록: LEVEL ${sessionBest}`;
  }

  saveScore(reached);

  // 패드 오버레이로 다시 도전 버튼 표시
  padOverlay.innerHTML = `<button class="start-btn" onclick="startGame()">다시 도전 🔄</button>`;
  padOverlay.classList.add('active');

  // accZone에 오차 칩
  const accHTML = buildAccuracyHTML(playerIntervals, !isTimeout);
  accZone.innerHTML = accHTML ? `<div class="result-box">${accHTML}</div>` : '';
}

// ── Level Complete ──
function levelComplete() {
  gameState = 'idle';
  if (inputTimeout) { clearTimeout(inputTimeout); inputTimeout = null; }

  const accHTML = buildAccuracyHTML(playerIntervals, false);
  stateDisp.textContent = '✨ 완벽!';
  stateDisp.style.color = 'var(--green)';

  level++;
  if (level - 1 > sessionBest) {
    sessionBest = level - 1;
    bestDisp.textContent = `최고 기록: LEVEL ${sessionBest}`;
  }

  // 하단에 오차 칩 잊간 표시 후 다음 레벨
  if (accHTML && playerIntervals.length > 0) {
    accZone.innerHTML = `<div class="result-box">${accHTML}</div>`;
    setTimeout(() => {
      accZone.innerHTML = '';
      if (gameState !== 'over') startLevel();
    }, 1800);
  } else {
    setTimeout(() => { if (gameState !== 'over') startLevel(); }, 1000);
  }
}

// ── Leaderboard / DB ──
async function saveScore(reached) {
  if (reached < 1) return;
  const cat = `echo_${mode}`;
  if (!window.dbAPI) return;
  try {
    const isTop = await window.dbAPI.isTop10('echo', cat, reached, 'desc');
    if (isTop) {
      const name = window.dbAPI.getGuestId();
      await window.dbAPI.saveScore('echo', cat, name, reached, `Lv.${reached}`);
      if (currentLbCat === cat) loadLeaderboard(cat);
    }
  } catch(e) { /* silently ignore network errors */ }
}

let currentLbCat = 'echo_normal';
function loadLeaderboard(cat = currentLbCat) {
  currentLbCat = cat;
  document.querySelectorAll('.lb-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  const list = document.getElementById('lbList');
  list.innerHTML = '<div class="lb-item empty">데이터를 불러오는 중...</div>';
  if (!window.dbAPI) { setTimeout(() => loadLeaderboard(cat), 150); return; }
  window.dbAPI.getTop10('echo', cat, 'desc').then(data => {
    if (!data || !data.length) {
      list.innerHTML = '<div class="lb-item empty">아직 기록이 없습니다. 첫 도전자가 되세요!</div>';
      return;
    }
    list.innerHTML = data.map((d, i) => `
      <div class="lb-item">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-name">${d.name}</span>
        <span class="lb-score">${d.extraText}</span>
      </div>`).join('');
  }).catch(() => {
    list.innerHTML = '<div class="lb-item empty">랭킹을 불러올 수 없습니다.</div>';
  });
}

document.getElementById('lbTabs').addEventListener('click', e => {
  if (e.target.classList.contains('lb-tab')) loadLeaderboard(e.target.dataset.cat);
});
loadLeaderboard();
</script>

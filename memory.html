<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>침팬지 기억력 테스트 : 순간 기억 및 공간 지각 훈련 | 스무스펀</title>
  <meta name="description" content="숫자가 가려진 뒤 오직 당신의 기억력만으로 순서를 정확히 맞춰보세요! 영장류의 한계에 도전하는 순간 기억력 테스트입니다.">
  <meta name="keywords" content="기억력 테스트, 침팬지 기억력, 순간 공간 지각, 두뇌 트레이닝, 뇌지컬">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080816; --surface:#0f0f28; --surface2:#181840;
      --accent:#6c3aff; --cyan:#00d4ff; --pink:#ff3aac;
      --gold:#ffd700; --text:#e8e8ff; --dim:#6060a0;
      --green:#00ff88; --red:#ff4444;
    }
    :root[data-theme="light"] {
      --bg:#f0f2ff; --surface:#ffffff; --surface2:#e8eaff;
      --accent:#5b2de0; --cyan:#0099cc; --pink:#cc2299;
      --gold:#b8860b; --text:#1a1a3a; --dim:#8080b0;
      --green:#00aa55; --red:#cc2222;
    }
    :root[data-theme="light"] body::before { background:none; }
    :root[data-theme="light"] .sq { background:#fff; border-color:rgba(0,0,0,.15); color:var(--text); }
    :root[data-theme="light"] .sq.hidden { background:#fff; border-color:var(--accent); color:transparent; }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Outfit','Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; overflow-x:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(108,58,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 90%, rgba(0,212,255,.08) 0%, transparent 60%);
      z-index: 0;
    }

    /* ── Header ── */
    header { text-align:center; padding:4.5rem 1rem .5rem; z-index:1; position:relative; }
    header h1 {
      font-size:clamp(1.8rem,5vw,3rem); font-weight:900; line-height:1.2;
      background:linear-gradient(135deg,var(--cyan),var(--accent),var(--pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    header p { color:var(--dim); font-size:.9rem; margin-top:.4rem; }

    .btn-home {
      display: inline-block; position: absolute; left: 1rem; top: 1rem;
      padding: .4rem .8rem; border-radius: 8px; font-size: .8rem; font-weight: 700;
      color: var(--cyan); text-decoration: none; border: 1px solid rgba(0,212,255,.3);
      transition: all .2s;
    }
    .btn-home:hover { background: rgba(0,212,255,.1); }

    /* ── Game Info ── */
    .info-bar {
      display:flex; justify-content:center; gap:2rem; margin:1rem 0;
      font-size:1.4rem; font-weight:800; font-family:'Outfit',sans-serif;
      z-index:1; position:relative;
    }
    .info-item { display:flex; flex-direction:column; align-items:center; }
    .info-label { font-size:.7rem; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:.2rem; }
    .info-val { color:var(--cyan); font-variant-numeric:tabular-nums; }

    /* ── Grid ── */
    .grid-wrap {
      width: min(100%, 600px); aspect-ratio: 4/3; margin: 0 auto;
      background:var(--surface); border:2px solid rgba(108,58,255,.3);
      border-radius:12px; position:relative; padding:10px;
      display:grid; grid-template-columns:repeat(8, 1fr); grid-template-rows:repeat(6, 1fr);
      gap:8px; z-index:1; box-shadow:0 10px 40px rgba(0,0,0,.5);
    }

    .sq {
      background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.1);
      border-radius:8px; display:flex; align-items:center; justify-content:center;
      font-size:1.8rem; font-weight:900; color:#fff; cursor:pointer;
      user-select:none; transition:all .1s;
    }
    .sq:active { transform:scale(0.92); }
    .sq.hidden {
      color:transparent; background:#fff; border-color:#fff;
    }
    .sq.cleared { opacity:0; pointer-events:none; }
    .sq.wrong { background:var(--red); border-color:var(--red); color:#fff !important; animation:shake .3s; }

    @keyframes shake {
      0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}
    }

    /* ── Start Overlay ── */
    .overlay {
      position:absolute; inset:0; background:rgba(0,0,0,.8); backdrop-filter:blur(4px);
      border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10; opacity:0; pointer-events:none; transition:opacity .3s;
    }
    .overlay.show { opacity:1; pointer-events:all; }
    .overlay-title { font-size:2rem; font-weight:900; color:var(--gold); margin-bottom:.5rem; }
    .overlay-desc { color:var(--text); text-align:center; line-height:1.5; font-size:.9rem; }
    
    .btn-start {
      margin-top:1.5rem; padding:1rem 3rem; border:none; border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--cyan)); color:#fff;
      font-weight:900; font-size:1.2rem; cursor:pointer; box-shadow:0 8px 20px rgba(0,212,255,.3);
      transition:transform .1s; font-family:inherit;
    }
    .btn-start:active { transform:scale(0.95); }

    /* ── Leaderboard ── */
    .lb-section {
      width:min(600px, 100% - 2rem); margin: 3rem auto 2rem;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:1.5rem; position:relative; z-index:1;
    }
    .lb-warning {
      background:rgba(255,68,68,.1); border:1px solid rgba(255,68,68,.3);
      color:#ffaaaa; font-size:.75rem; padding:.8rem; border-radius:8px;
      margin-bottom:1.5rem; line-height:1.4; text-align:center; word-break:keep-all;
    }
    .lb-header { text-align:center; margin-bottom:1rem; }
    .lb-header h2 { font-size:1.4rem; color:var(--gold); display:flex; align-items:center; justify-content:center; gap:.5rem; }
    .lb-tabs { display:flex; gap:.4rem; justify-content:center; margin-bottom:1rem; flex-wrap:wrap; }
    .lb-tab {
      background:transparent; border:1px solid rgba(255,255,255,.2); color:var(--dim);
      padding:.3rem .8rem; border-radius:20px; font-size:.75rem; cursor:pointer; font-family:inherit; transition:all .2s;
    }
    .lb-tab.active { background:var(--gold); color:#000; border-color:var(--gold); font-weight:800; }
    .lb-list { display:flex; flex-direction:column; gap:.4rem; min-height:150px; }
    .lb-item {
      display:flex; align-items:center; background:rgba(0,0,0,.3); padding:.6rem 1rem;
      border-radius:10px; font-size:.9rem;
    }
    .lb-item.empty { justify-content:center; color:var(--dim); font-size:.8rem; font-style:italic; }
    .lb-rank { width:24px; font-weight:900; color:var(--dim); }
    .lb-item:nth-child(1) .lb-rank { color:var(--gold); }
    .lb-item:nth-child(2) .lb-rank { color:#c0c0c0; }
    .lb-item:nth-child(3) .lb-rank { color:#cd7f32; }
    .lb-name { flex:1; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:1rem; }
    .lb-score { font-family:monospace; font-size:.95rem; color:var(--cyan); font-weight:700; }

    
    
    
    
    @media (max-width:1300px) {  }
  
    /* AdSense 사이드바 */
    .ad-sidebar { position:fixed; top:120px; height:600px; width:160px; z-index:10; }
    .ad-left  { left: calc(50% - 550px); }
    .ad-right { right: calc(50% - 550px); }
    @media (max-width: 1150px) { .ad-sidebar { display:none !important; } }
  </style>

</head>
<body>

<div class="ad-sidebar ad-left">
  <ins class="adsbygoogle" style="display:block;width:160px;height:600px"
    data-ad-client="ca-pub-1363977997493751" data-ad-slot="XXXXXXXXXX"></ins>

<div class="ad-sidebar ad-right">
  <ins class="adsbygoogle" style="display:block;width:160px;height:600px"
    data-ad-client="ca-pub-1363977997493751" data-ad-slot="XXXXXXXXXX"></ins>

</div>

<header>
  <a href="index.html" class="btn-home">← 홈으로</a>
  <h1>🐒 침팬지 기억력 테스트</h1>
  <p>1을 누르면 숫자가 가려집니다. 순서대로 빈칸을 기억해내세요!</p>
</header>

<div class="info-bar">
  <div class="info-item">
    <div class="info-label">LEVEL</div>
    <div class="info-val" id="levelDisp">4</div>
  </div>
  <div class="info-item">
    <div class="info-label">TIME</div>
    <div class="info-val" id="timeDisp">0.00s</div>
  </div>
</div>

<div class="grid-wrap" id="grid">
  <!-- JavaScript 렌더링 영역 -->
  <div class="overlay show" id="overlay">
    <div class="overlay-title" id="ovTitle">Level 4 시작</div>
    <div class="overlay-desc" id="ovDesc">1번을 누르면 나머지 숫자가 모두 뒤집힙니다.<br>기억력으로 순서를 맞춰보세요!</div>
    <button class="btn-start" id="startBtn">시작하기</button>
  </div>
</div>

<div class="lb-section">
  <div class="lb-warning">⚠️ <b>정정당당한 승부!</b><br>클라이언트 변조를 통한 비정상적인 스코어 조작은 모든 참여자의 재미를 반감시킵니다. 양심적인 플레이를 부탁드립니다.</div>
  <div class="lb-header"><h2>🏆 오늘의 TOP 10</h2></div>
  <div class="lb-tabs" id="lbTabs">
    <button class="lb-tab active" data-cat="all">통합 랭킹</button>
  </div>
  <div class="lb-list" id="lbList"><div class="lb-item empty">랭킹 불러오는 중...</div></div>
</div>

<script>
const COLS = 8;
const ROWS = 6;
const TOTAL_CELLS = COLS * ROWS;
let currentLevel = 4;
let highestLevel = 4;
let totalTimeMs = 0;

let expectedNum = 1;
let isPlaying = false;
let isBlind = false;

let startTime = 0;
let levelStartTime = 0;
let reqId = null;

const gridEl = document.getElementById('grid');
const overlayEl = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const ovTitle = document.getElementById('ovTitle');
const ovDesc = document.getElementById('ovDesc');
const levelDisp = document.getElementById('levelDisp');
const timeDisp = document.getElementById('timeDisp');

// ── Timer Logic ───────────────────────
function updateTimer() {
  if (!isPlaying) return;
  const now = performance.now();
  const elapsed = totalTimeMs + (now - levelStartTime);
  timeDisp.textContent = (elapsed / 1000).toFixed(2) + 's';
  reqId = requestAnimationFrame(updateTimer);
}

// ── Game Logic ────────────────────────
function buildGrid() {
  // Clear grid
  const cells = gridEl.querySelectorAll('.sq');
  cells.forEach(c => c.remove());

  // Pick random positions
  let indices = [];
  while(indices.length < currentLevel) {
    let r = Math.floor(Math.random() * TOTAL_CELLS);
    if (!indices.includes(r)) indices.push(r);
  }

  // Create virtual 48 cells to handle grid placement
  for (let i = 0; i < TOTAL_CELLS; i++) {
    const isTarget = indices.indexOf(i);
    if (isTarget !== -1) {
      const sq = document.createElement('div');
      sq.className = 'sq';
      sq.textContent = isTarget + 1;
      sq.dataset.num = isTarget + 1;
      sq.style.gridArea = `${Math.floor(i / COLS) + 1} / ${i % COLS + 1}`;
      
      sq.addEventListener('click', handleSqClick);
      gridEl.appendChild(sq);
    }
  }
}

function handleSqClick(e) {
  if (!isPlaying) return;
  const sq = e.currentTarget;
  if (sq.classList.contains('cleared')) return;

  const num = parseInt(sq.dataset.num);
  
  if (num === expectedNum) {
    if (window.sfAudio) window.sfAudio.play('tap');
    // Correct
    if (num === 1) {
      // Blind all others
      isBlind = true;
      document.querySelectorAll('.sq').forEach(s => {
        if (!s.classList.contains('cleared') && parseInt(s.dataset.num) > 1) {
          s.classList.add('hidden');
        }
      });
    }
    
    sq.classList.remove('hidden');
    sq.classList.add('cleared');
    expectedNum++;
    
    // Level clear
    if (expectedNum > currentLevel) {
      isPlaying = false;
      if (window.sfAudio) window.sfAudio.play('pass');
      cancelAnimationFrame(reqId);
      totalTimeMs += (performance.now() - levelStartTime);
      timeDisp.textContent = (totalTimeMs / 1000).toFixed(2) + 's';
      
      highestLevel = currentLevel;
      currentLevel++;
      showOverlay(`Level ${currentLevel} 준비`, '다음 스테이지로 넘어갑니다.', '다음 스테이지');
    }
  } else {
    // Wrong!
    isPlaying = false;
    if (window.sfAudio) window.sfAudio.play('fail');
    cancelAnimationFrame(reqId);
    totalTimeMs += (performance.now() - levelStartTime);
    sq.classList.remove('hidden');
    sq.classList.add('wrong');
    
    // Reveal all
    document.querySelectorAll('.sq').forEach(s => {
      s.classList.remove('hidden');
      if (parseInt(s.dataset.num) === expectedNum) s.style.border = '2px solid var(--gold)';
    });

    handleGameOver();
  }
}

function showOverlay(title, desc, btnText) {
  ovTitle.textContent = title;
  ovDesc.innerHTML = desc;
  startBtn.textContent = btnText;
  overlayEl.classList.add('show');
}

function startGame() {
  if (window.sfAudio) window.sfAudio.play('tap');
  overlayEl.classList.remove('show');
  expectedNum = 1;
  isBlind = false;
  levelDisp.textContent = currentLevel;
  
  // Reset on restart
  if (currentLevel === 4) {
    totalTimeMs = 0;
    highestLevel = 4;
    timeDisp.textContent = '0.00s';
  }
  
  buildGrid();
  
  // Slight delay before allowing clicks to prevent double tap
  setTimeout(() => {
    isPlaying = true;
    levelStartTime = performance.now();
    reqId = requestAnimationFrame(updateTimer);
  }, 200);
}

function handleGameOver() {
  showOverlay('게임 오버 💀', `도달 레벨: <b>${highestLevel}</b><br>총 소요 시간: <b>${(totalTimeMs/1000).toFixed(2)}s</b>`, '처음부터 다시');
  
  // Submit Score
  setTimeout(async () => {
    if (!window.dbAPI) return;
    
    // Custom sort criteria: level DESC, tiebreaker time_ms ASC.
    // However, Firebase simple orderByChild only supports one property. 
    // We can store a composite score!
    // composite = (level * 10000000) - (time_ms/1000) (so higher is better)
    const compositeScore = (highestLevel * 10000000) - totalTimeMs;
    
    const isTop = await window.dbAPI.isTop10('memory', 'all', compositeScore, 'desc');
    if (isTop) {
      const name = window.dbAPI.getGuestId();
      await window.dbAPI.saveScore('memory', 'all', name, compositeScore, `Lv.${highestLevel} (${(totalTimeMs/1000).toFixed(2)}s)`);
      loadLeaderboard();
    }
  }, 500);

  currentLevel = 4; // Reset
}

startBtn.addEventListener('click', startGame);

// ── Leaderboard Logic ─────────────────────
function loadLeaderboard() {
  const list = document.getElementById('lbList');
  list.innerHTML = '<div class="lb-item empty">데이터를 불러오는 중...</div>';
  
  if (!window.dbAPI) { setTimeout(loadLeaderboard, 100); return; }
  window.dbAPI.getTop10('memory', 'all', 'desc').then(data => {
    if (!data || data.length === 0) { list.innerHTML = '<div class="lb-item empty">아직 기록이 없습니다. 첫 랭커가 되어보세요!</div>'; return; }
    list.innerHTML = data.map((d, i) => `
      <div class="lb-item">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-name">${d.name}</span>
        <span class="lb-score">${d.extraText}</span>
      </div>`).join('');
  });
}
loadLeaderboard();
</script>
</body>
